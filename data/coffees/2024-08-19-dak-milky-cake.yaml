personal_notes: |-
  24 days. 0.3 grind too coarse even for turbo. Even in bad shots the nutty, spiced flavor notes are unmistakeable.  9.6 grind finally too fine for turbo, pulls a standard shot. Very good between 0 and 9.6.
  200 degrees, 4.7 grind very good with Melodrip, could even go a little finer (4.3?).
  4.4 grind, 208 degrees on UFO is good, sweet and nutty.
  4.4 grind, 206 degrees, 17:280 MD sweet recipe also works very well.

