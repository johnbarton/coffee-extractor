personal_notes: |-
  Rest ~45 days. High solubility, long ratio (1:18) recommended.
  44 days. 208 degrees, 4.0 grind with UFO, 15:250. Strong body, longer ratio might really be good. Keep same grind size for next attempt.
  49 days. Tried 4.3 grind, slightly lower temperature at 206 and longer ratio. Less bitterness but a bit muted. Maybe just slightly finer.
  58 days. 4.2 grind, 206 degrees, 16.7:275. Its amazing! Sad that this is the last dose.

