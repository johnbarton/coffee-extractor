  203 temperature. Moved to Atmos at 22 days.
  20 days. 1.0 grind, 19g in 50g out in 20s (!). Almost a turbo shot. Nice red berry flavors and acidity.
  22 days. 0.66 grind for standard shot, 1.2 for turbo. Standard shot emphasizes acidity.
  26 days. 0.66 grind, maybe best shot so far? 19g in 50g out in 24s. Next time try going even finer than 0.5.
  28 days. 0.33 grind.
  For turbo shot with new filters at 7 bar, need 2.3 grind for 17g dose.

