personal_notes: |-
  14 days. Best grind size around 1.66 (before aligning burrs, now maybe coarser), 18g in 40g out in ~35s. Deep jammy flavor in some cups. At 2.0 grind, higher acidity and less fruit.
  20 days. Fruit flavor mostly gone, less acidity but remains a pleasant cup. Currently grinding around 2.33. Consider going coarser for more even extraction throughout.

