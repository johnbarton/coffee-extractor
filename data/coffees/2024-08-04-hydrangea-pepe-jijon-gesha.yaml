personal_notes: |-
  17 days. BQ V60, 5.3 grind on ZP6. Pleasant but very subtle, maybe needs more time.
  19 days. 17g espresso, 1.0 grind almost perfect for turbo shot, 54g out in 21s. Lots of acidity and body, feels maybe a bit too heavy?
  25 days. Getting lots of acidity but still some earthiness. 0.8 grind too fast, maybe go coarser instead? Start of shot is slow then pulling very fast, channeling? I was right! 1.0 grind from the freezer pulls a standard shot at 1:3. Coarser for turbo.

