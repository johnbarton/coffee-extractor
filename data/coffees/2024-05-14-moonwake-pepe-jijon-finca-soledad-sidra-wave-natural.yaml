personal_notes: |-
  7 bar, 200 degrees, Good Brothers dry paper filter in Unibasket.
  21 days. 1.3 grind is much too fast, 17g in 51g out in 11s. 0.66 grind also too fast. Not bad but very subtle. Next time try 0.2. One 0.2 was good but another ran too fast. Maybe go slightly below 0.
  24 days. 9.66 grind is perfect for a turbo shot. Pleasant but flavors are still a bit muted.
  26 days. Pretty nice turbo shot at 0 grind. Now opening up a bit? Maybe increase dose slightly next time at 0 grind. With new basket and 18g dose 0.3 pulls a standard shot.
  Brian Quan V60 at 5.0 grind with ZP6, very sweet and pleasant tropical fruit. With UFO and Melodrip, maybe try 3.7 grind. 4.0 is good but fast drawdown. 210 degrees.

