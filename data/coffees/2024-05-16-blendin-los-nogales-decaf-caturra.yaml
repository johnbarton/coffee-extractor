personal_notes: |-
  196 degrees. Weber Unibasket with Good Brothers paper filter.
  13 days. 1.3 grind, 18g in 50g out in 16s. What the fuck. Incredible crème brûlée fragrance, very sweet, berries, sugary. Tastes like a dessert in a cortado. With wet paper filter it runs faster, need either dry filter or finer grind. 1.0 grind also very fast, try 0.5.
  From freezer, turbo shot grind should be between 0 and 9.6. Maybe a little overextracted, weaker shot tastes a bit better.

