personal_notes: |-
  Frozen for 6 days.
  16 days. 195 degrees, Unibasket with paper filter. 1.2 grind, 18g in 48g out in 24s. Needs to be finer!
  18 days. 1.3 grind turbo shot, 17g in 50g out in 16s. Really pleasant shot, tempers the winey aftertaste.
  21 days. 0.5 grind turbo shot at 7 bar. 17g in 50g out in about 20s. Another very good cup.
  22 days. Same sweet spot for grind. Tried low temperature extraction at 189 degrees. Not bad but just more bland flavor.
  With new dry paper filter 1.0 not coarse enough for turbo. Around 1.5 works well.

